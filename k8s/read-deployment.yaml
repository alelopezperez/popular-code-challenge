apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-ms-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: read-ms-node
  template:
    metadata:
      labels:
        app: read-ms-node
    spec:
      containers:
        - name: read-ms-node
          image: read-ms:latest
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: CRUD_MS_ID
              valueFrom:
                secretKeyRef:
                  name: read-ms-secrets
                  key: CRUD_MS_ID
            - name: CRUD_MS_SECRET
              valueFrom:
                secretKeyRef:
                  name: read-ms-secrets
                  key: CRUD_MS_SECRET
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
